name: 깝휘캣 자동 게시

on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 KST
    - cron: '0 4 * * *'   # 13:00 KST
    - cron: '0 10 * * *'  # 19:00 KST
  workflow_dispatch:
    inputs:
      question:
        description: '질문을 직접 넣어 실행 (비우면 Notion 대기 질문). Notion 상태는 바꾸지 않음'
        required: false
        default: ''
      ignore_daily_limit:
        description: '하루 게시 한도 무시 (월 예산 한도는 그대로)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-pages
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      QUESTION: ${{ inputs.question }}
      IGNORE_DAILY_LIMIT: ${{ inputs.ignore_daily_limit }}
      PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: 조사·제작
        id: prepare
        run: node src/pipeline.js prepare

      - name: 게시물 이미지와 게임 사이트 합치기
        if: steps.prepare.outputs.skip == 'false'
        run: node scripts/build-pages.js out/post/slides

      - name: Pages 배포 준비
        if: steps.prepare.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages

      - name: GitHub Pages에 이미지 올리기
        if: steps.prepare.outputs.skip == 'false'
        uses: actions/deploy-pages@v4

      - name: Instagram 게시
        if: steps.prepare.outputs.skip == 'false'
        run: node src/pipeline.js publish

      - name: 실패 기록
        if: failure()
        run: node src/pipeline.js fail

      - name: 사용량·게시 기록 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usage.json archive 2>/dev/null || git add data/usage.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "사용량 기록 갱신"
          git push -q
