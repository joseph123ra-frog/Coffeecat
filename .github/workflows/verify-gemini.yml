name: Gemini 연결 확인

on:
  push:
    branches: [claude/brave-archimedes-77048b]
    paths:
      - '.github/workflows/verify-gemini.yml'
      - 'scripts/verify-gemini.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-gemini.js
